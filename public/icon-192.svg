<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ef"/>
      <stop offset="100%" style="stop-color:#f0e6d8"/>
    </linearGradient>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a878"/>
      <stop offset="100%" style="stop-color:#b8865c"/>
    </linearGradient>
    <radialGradient id="cg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff8c0;stop-opacity:0.9"/>
      <stop offset="55%" style="stop-color:#f4c060;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#f4c060;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="oc">
      <ellipse cx="96" cy="104" rx="56" ry="68"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>

  <!-- Chain bail -->
  <path d="M 90,28 Q 96,22 102,28" fill="none" stroke="#d4a878" stroke-width="1.4" opacity="0.5"/>
  <circle cx="96" cy="22" r="3.5" fill="#d4a878" opacity="0.5"/>

  <!-- Hinge -->
  <rect x="90" y="30" width="12" height="7" rx="3.5" fill="#d4a878" opacity="0.62"/>

  <!-- Locket frame -->
  <ellipse cx="96" cy="104" rx="60" ry="72" fill="url(#rg)" opacity="0.52"/>
  <ellipse cx="96" cy="104" rx="56" ry="68" fill="#fdf8f2"/>
  <ellipse cx="96" cy="104" rx="52" ry="64" fill="none" stroke="#d4a878" stroke-width="0.8" opacity="0.38"/>
  <ellipse cx="96" cy="104" rx="48" ry="60" fill="none" stroke="#e8c898" stroke-width="0.4" stroke-dasharray="2,3" opacity="0.4"/>

  <!-- Interior scene -->
  <g clip-path="url(#oc)">
    <rect x="40" y="36" width="112" height="136" fill="#fdf4ec"/>
    <!-- Gable -->
    <polygon points="40,80 96,44 152,80" fill="#ecdcc8" opacity="0.52"/>
    <!-- Window -->
    <polygon points="82,70 96,52 110,70 107,80 85,80" fill="#fff8e0" opacity="0.88"/>
    <line x1="96" y1="52" x2="96" y2="80" stroke="#c8a888" stroke-width="0.6" opacity="0.38"/>
    <line x1="82" y1="66" x2="110" y2="66" stroke="#c8a888" stroke-width="0.6" opacity="0.38"/>

    <!-- Candle glow -->
    <ellipse cx="96" cy="138" rx="30" ry="16" fill="url(#cg)" opacity="0.92"/>
    <!-- Saucer -->
    <ellipse cx="96" cy="146" rx="11" ry="3.5" fill="#d4a878" opacity="0.82"/>
    <!-- Body -->
    <rect x="92" y="124" width="8" height="22" rx="2" fill="#f5eedd"/>
    <!-- Wick -->
    <line x1="96" y1="124" x2="96" y2="119" stroke="#4a3020" stroke-width="1"/>
    <!-- Flame -->
    <ellipse cx="96" cy="113" rx="3.5" ry="7" fill="#ffe050"/>
    <ellipse cx="96" cy="115" rx="2" ry="4" fill="#ff9020" opacity="0.8"/>

    <!-- Rose -->
    <g transform="translate(56, 118)">
      <path d="M 8,30 Q 5,18 7,8 Q 7.5,3 8.5,0" fill="none" stroke="#7a9474" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="8.5" cy="1" r="6.5" fill="#d4a0b4" opacity="0.6"/>
      <circle cx="13" cy="-1" r="5.5" fill="#e0b8c4" opacity="0.68"/>
      <circle cx="4" cy="-1" r="5.5" fill="#e0b8c4" opacity="0.68"/>
      <circle cx="8.5" cy="-4" r="5" fill="#d4a0b4" opacity="0.75"/>
      <circle cx="8.5" cy="0" r="3" fill="#c07888" opacity="0.78"/>
    </g>

    <!-- Key -->
    <g transform="translate(114, 120)">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#d4a878" stroke-width="2.4"/>
      <circle cx="8" cy="8" r="3.5" fill="none" stroke="#d4a878" stroke-width="1.2"/>
      <rect x="6.5" y="14" width="3.5" height="19" rx="1.75" fill="#d4a878"/>
      <rect x="10" y="21" width="6" height="2.8" rx="1" fill="#d4a878"/>
      <rect x="10" y="26" width="4.5" height="2.8" rx="1" fill="#d4a878"/>
    </g>
  </g>

  <!-- Bottom text -->
  <text x="96" y="186" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="9" font-style="italic" fill="#9a8070" letter-spacing="1.5" opacity="0.7">Deb's Attic</text>
</svg>
